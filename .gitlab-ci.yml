include:
  - template: Security/Secret-Detection.gitlab-ci.yml

# Sin esto, el pipeline de la MR no crea jobs (CI_COMMIT_BRANCH no existe
# en merge_request_event) y GitLab lo marca failed: ci_must_pass bloquea el merge.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

secret_detection:
  rules:
    - if: $SECRET_DETECTION_DISABLED
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
